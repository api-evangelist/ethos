apis:
- name: Ethos Partnership API
  description: >-
    Partner-gated API surface exposing Ethos's underwriting and interview engines. Partners can
    retrieve customized quotes, conduct interviews and instant underwriting, collect required
    policy and billing information, and generate signed policy documents while controlling their
    own branding and UX. Authentication is a bearer token generated from a partner API key and
    tied to an individual application session (session data stored server-side, invalidatable by
    Ethos). No public OpenAPI is published; access is provisioned per partner.

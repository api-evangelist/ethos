aid: ethos
name: Ethos
description: >-
  Ethos (Ethos Technologies Inc.) is a modern online life insurance platform founded in 2016
  that lets eligible applicants get covered in as little as ten minutes without a medical exam,
  with coverage up to $3 million. Ethos offers term life, whole life, Indexed Universal Life (IUL),
  final expense, and guaranteed-issue policies through multiple top-rated carriers, plus wills,
  trusts, and estate-planning services. Beyond its direct-to-consumer and agent channels, Ethos
  exposes its underwriting and interview engines to enterprise partners through a set of
  partnership APIs, allowing partners to retrieve customized quotes, run instant interviews and
  underwriting, collect policy and billing information, and generate signed policy documents while
  keeping their own branding and UX. The partner API is gated behind a bearer token generated from
  a partner API key and tied to an individual application session.
